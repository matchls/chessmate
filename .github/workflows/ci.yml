# CI (intégration continue) : vérifications lancées à chaque PR et à chaque fusion sur main.
# Elle refait côté serveur ce que `pnpm check` fait sur le poste (et le hook pre-push).
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Si on pousse deux fois de suite sur la même PR, on annule la vérification précédente.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifications:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer pnpm
        uses: pnpm/action-setup@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Mise en forme du code (Prettier)
        run: pnpm format:check

      - name: Lint (ESLint)
        run: pnpm lint

      - name: Vérification des types (TypeScript)
        run: pnpm typecheck

      - name: Tests unitaires (Vitest)
        run: pnpm test

      - name: Construction (Next.js)
        run: pnpm build
